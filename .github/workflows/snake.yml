name: Generate Profile Assets

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: inkyzx
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark

      - name: Fix generated assets directory permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate streak and activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: inkyzx
          OUTPUT_DIR: dist
        run: python scripts/generate_stats.py

      - name: Publish profile assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
